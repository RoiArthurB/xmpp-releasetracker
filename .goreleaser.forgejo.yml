version: 2

gitea_urls:
  api: https://git.arthurbrugiere.fr/api/v1/
  download: https://git.arthurbrugiere.fr/

before:
  hooks:
    - go mod tidy

builds:
  - ldflags:
      - "-s -w -X main.version={{.Version}}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
      - "386"
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# One multi-platform buildx build per run: builds, pushes and assembles the
# manifest list in one step (replaces the deprecated dockers +
# docker_manifests pair).
dockers_v2:
  - dockerfile: Dockerfile.goreleaser
    images:
      - "{{ .Env.REGISTRY }}/{{ .Env.REGISTRY_USERNAME }}/xmpp-releasetracker"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
