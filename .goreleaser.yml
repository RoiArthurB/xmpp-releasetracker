version: 2

before:
  hooks:
    - go mod tidy

builds:
  - ldflags:
      - "-s -w -X main.version={{.Version}}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
      - "386"
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: arm    # 32-bit ARM never existed on macOS
      - goos: darwin
        goarch: "386"  # dropped since macOS Catalina
      - goos: windows
        goarch: arm    # 32-bit ARM Windows is essentially unused

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# One multi-platform buildx build per run: builds, pushes and assembles the
# manifest list in one step (replaces the deprecated dockers +
# docker_manifests pair). Every image is pushed with every tag.
dockers_v2:
  - dockerfile: Dockerfile.goreleaser
    images:
      - "{{ .Env.DOCKERHUB_USERNAME }}/xmpp-releasetracker"
      - "ghcr.io/{{ .Env.GHCR_USERNAME }}/xmpp-releasetracker"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
